name: Linux

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  SHORT_NAME: base-console
  ARCH: x64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set version
      id: set_version
      run: |
        git_tag=$(git describe --tags --abbrev=0 || echo v0.0)
        echo "version=$git_tag" >> $GITHUB_OUTPUT

    - name: Build
      run: |
        make CFLAGS=-DAPP_VERSION="${{ steps.set_version.outputs.version }}"
        mv ./${{ env.SHORT_NAME }} ./${{ env.SHORT_NAME }}_${{ env.ARCH }}_linux

    - name: Display SHA-256
      run: sha256sum ./${{ env.SHORT_NAME }}_${{ env.ARCH }}_linux

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ github.event_name == 'push' }}
      with:
        name: ${{ env.ARCH }}_linux
        path: ./${{ env.SHORT_NAME }}_${{ env.ARCH }}_linux

    - name: Upload release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: ./${{ env.SHORT_NAME }}_${{ env.ARCH }}_linux
